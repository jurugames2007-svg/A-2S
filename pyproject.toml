[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "a2s"
version = "1.5.0"
description = "A²S — Agente autónomo con loops auto-optimizados, superación de estancamiento, memoria evolutiva y registro forense con cadena de custodia."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "A²S" }]
keywords = ["agent", "autonomous", "forensics", "self-optimizing", "loop"]

[project.scripts]
a2s = "a2s.cli:main"

[tool.setuptools.packages.find]
include = ["a2s*"]
